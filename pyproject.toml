[project]
name = "second-brain"
version = "0.1.0"
description = "Retrieval-first personal memory system backend foundation."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "openai>=1.0.0",
    "pgvector>=0.3.0",
    "psycopg[binary]>=3.2.0",
    "SQLAlchemy>=2.0.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
